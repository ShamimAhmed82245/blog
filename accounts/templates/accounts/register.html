{% extends "base.html" %}


{% block body %}
<h1>Register Page</h1>
{{form.non_field_errors}}
<form action="" method="post">
    {% csrf_token %}
    {% for field in form %}
    {{field.label_tag}}
    {{field}}
    {{field.errors}}
    {% endfor %}

    <button type="submit">submit</button>
</form>
{% endblock %}
